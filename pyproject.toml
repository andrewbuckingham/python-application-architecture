[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "python-app-structure"
version = "0.1.0"
description = "Skeleton demonstrating clean layered architecture in Python"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.19.0",
    "pyodbc>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes all top-level packages importable without installing the project
pythonpath = ["."]

[tool.coverage.run]
source = ["domain", "infrastructure", "presentation"]
omit = ["tests/*"]
